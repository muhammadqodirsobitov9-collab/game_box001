name: Build Flutter Gamebox APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Find Flutter Root and Build
        run: |
          # pubspec.yaml joylashgan papkani avtomatik topish
          PROJECT_DIR=$(dirname $(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1))
          echo "Loyiha papkasi topildi: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gamebox-v1.0.0-debug
          path: "**/build/app/outputs/flutter-apk/app-debug.apk"
