name: Build Flutter Gamebox APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Files and Build APK
        run: |
          # Автоматический поиск папки с pubspec.yaml
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          
          cd "$PROJECT_DIR"
          
          # Генерация недостающих папок android/ios
          flutter create . --platforms=android
          
          # Сборка приложения
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gamebox-v1.0.0-debug
          path: "**/build/app/outputs/flutter-apk/app-debug.apk"
        
