name: Build Flutter Gamebox APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Auto-fix Ticker Imports and Build APK
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          
          cd "$PROJECT_DIR"
          
          # android papkasini yaratish
          flutter create . --platforms=android
          
          # Barcha o'yin fayllariga yetishmayotgan importni avtomatik qo'shish
          find lib/games -name "*.dart" -exec sed -i '1i import '\''package:flutter/scheduler.dart'\'';' {} +
          
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gamebox-v1.0.0-debug
          path: "**/build/app/outputs/flutter-apk/app-debug.apk"
