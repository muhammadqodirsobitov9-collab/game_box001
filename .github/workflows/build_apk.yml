name: Build Flutter Gamebox APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Auto-fix Imports, compileSdk and Build APK
        run: |
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          
          cd "$PROJECT_DIR"
          
          # Android papkasini yaratamiz
          flutter create . --platforms=android
          
          # Ticker import xatoligini to'g'rilaymiz
          find lib/games -name "*.dart" -exec sed -i '1i import '\''package:flutter/scheduler.dart'\'';' {} +
          
          # compileSdk versiyasini 36 ga oshiramiz (file_picker uchun)
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle || true

          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gamebox-v1.0.0-debug
          path: "**/build/app/outputs/flutter-apk/app-debug.apk"
