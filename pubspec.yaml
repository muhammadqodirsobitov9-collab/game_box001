name: gamebox
description: "GameBox — lightweight mobile game platform with original mini-games."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  archive: ^3.6.1
  file_picker: ^8.1.2
  crypto: ^3.0.3
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0E23"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0A0E23"
  image: "assets/icon/splash_logo.png"
  color_dark: "#0A0E23"
  image_dark: "assets/icon/splash_logo.png"
  android_12:
    image: "assets/icon/splash_logo.png"
    icon_background_color: "#0A0E23"
    image_dark: "assets/icon/splash_logo.png"
    icon_background_color_dark: "#0A0E23"
